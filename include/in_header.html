
<style type="text/css">

/* padding for bootstrap navbar */
body {
  padding-top: 50px;
  padding-bottom: 40px;
}

/* offset scroll position for anchor links (for fixed navbar)  */
.section h2 {
  padding-top: 55px;
  margin-top: -55px;
}
.section h3 {
  padding-top: 55px;
  margin-top: -55px;
}

/* don't use link color in navbar */
.dropdown-menu>li>a {
	display: inline;
  color: black;
  padding-top: 0;
  padding-bottom: 0;
}

.dropdown-menu .divider {
	margin-top: 2px;
	margin-bottom: 2px;
}

img {
  max-width: 85% !important;
}

/*
img.center {
  display: block;
  margin: 0 auto;
}
*/

/* Copy button styles */
.code-container {
  position: relative;
}

.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid #ccc;
  border-radius: 3px;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 1;
}

.code-container:hover .copy-btn {
  opacity: 1;
}

.copy-btn:hover {
  background: rgba(255, 255, 255, 0.95);
}

.copy-btn.copied {
  background: #d4edda;
  border-color: #c3e6cb;
  color: #155724;
}

pre {
  position: relative;
  overflow-x: auto;
  white-space: pre;
  word-wrap: normal;
  max-width: 100%;
}

pre code {
  white-space: pre;
  word-wrap: normal;
  overflow-wrap: normal;
  display: block;
  padding-right: 60px; /* Leave space for copy button */
}

/* Ensure container doesn't exceed viewport */
.code-container {
  max-width: 100%;
  overflow: hidden;
}

</style>

<link rel="stylesheet" href="libs/font-awesome-4.1.0/css/font-awesome.min.css"/>
<link rel="shortcut icon" type="image/png" href="/docs/images/icon.png"/>

<script>
// Copy to clipboard functionality
document.addEventListener('DOMContentLoaded', function() {
  // Add copy buttons to all pre code blocks
  const preElements = document.querySelectorAll('pre');

  preElements.forEach(function(pre) {
    // Create container
    const container = document.createElement('div');
    container.className = 'code-container';

    // Insert container before pre element
    pre.parentNode.insertBefore(container, pre);

    // Move pre element into container
    container.appendChild(pre);

    // Create copy button
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy';

    // Add click event
    copyBtn.addEventListener('click', function() {
      const code = pre.querySelector('code') || pre;
      const text = code.textContent;

      navigator.clipboard.writeText(text).then(function() {
        copyBtn.innerHTML = '<i class="fa fa-check"></i> Copied!';
        copyBtn.classList.add('copied');

        setTimeout(function() {
          copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(function(err) {
        console.error('Failed to copy: ', err);
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);

        copyBtn.innerHTML = '<i class="fa fa-check"></i> Copied!';
        copyBtn.classList.add('copied');

        setTimeout(function() {
          copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });

    // Add button to container
    container.appendChild(copyBtn);
  });
});
</script>
